[project]
name = "weather-app"
version = "0.1.0"
description = "A weather chat assistant with input guardrails"
readme = "README.md"
authors = [
    { name = "thedownsideup", email = "mahsa.esk77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
weather-app = "weather_app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
